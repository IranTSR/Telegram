name: Build Telegram XRay

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: xray-proxy
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/release.keystore
          ls -la TMessagesProj/config/release.keystore

      - name: Build standalone APK (arm64-v8a, armeabi-v7a, x86_64, x86)
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ALIAS_PASS }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ALIAS_NAME }}" \
            --stacktrace

      - name: Rename APK
        run: |
          cd TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone
          ls -la
          mv app.apk Telegram-XRay-12.10.5-universal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-XRay-12.10.5
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/Telegram-XRay-12.10.5-universal.apk
