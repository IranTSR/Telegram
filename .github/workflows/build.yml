name: Build Telegram XRay

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release with the 5 APKs"
        type: boolean
        default: true

permissions:
  contents: write

env:
  APP_VERSION_NAME: "12.10.5"
  RELEASE_TAG: "v12.10.5-xray1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: xray-proxy
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/release.keystore
          ls -la TMessagesProj/config/release.keystore

      - name: Build Xray core for 32-bit ABIs (arm32/x86)
        run: |
          # Upstream Xray-core no longer ships android binaries for armeabi-v7a/x86;
          # build them from the same source tag with Go (GOOS=android, pure Go, no NDK needed).
          sudo apt-get install -y golang-go 2>/dev/null || true
          if ! command -v go >/dev/null; then
            GO_TGZ=/tmp/go.tgz
            curl -sSL -o "$GO_TGZ" https://go.dev/dl/go1.24.7.linux-amd64.tar.gz
            sudo tar -xzf "$GO_TGZ" -C /usr/local
            echo "/usr/local/go/bin" >> $GITHUB_PATH
            export PATH=/usr/local/go/bin:$PATH
          fi
          go version
          git clone --depth 1 --branch v26.3.27 https://github.com/XTLS/Xray-core.git /tmp/xray-src
          mkdir -p "$GITHUB_WORKSPACE/xray-prebuilt/armeabi-v7a" "$GITHUB_WORKSPACE/xray-prebuilt/x86"
          cd /tmp/xray-src
          GOOS=android GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/xray-prebuilt/armeabi-v7a/libxray.so" ./main
          GOOS=android GOARCH=386 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/xray-prebuilt/x86/libxray.so" ./main
          file "$GITHUB_WORKSPACE/xray-prebuilt/armeabi-v7a/libxray.so" "$GITHUB_WORKSPACE/xray-prebuilt/x86/libxray.so"
          echo "XRAY_PREBUILT_DIR=$GITHUB_WORKSPACE/xray-prebuilt" >> $GITHUB_ENV

      - name: Build standalone APKs (universal + per-ABI)
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
                    :TMessagesProj_AppStandalone:assembleA64Standalone \
                    :TMessagesProj_AppStandalone:assembleA32Standalone \
                    :TMessagesProj_AppStandalone:assembleX64Standalone \
                    :TMessagesProj_AppStandalone:assembleX86Standalone \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ALIAS_PASS }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ALIAS_NAME }}" \
            --stacktrace

      - name: Rename APKs
        run: |
          OUT=TMessagesProj_AppStandalone/build/outputs/apk
          mkdir -p dist
          mv "$OUT/afat/standalone/app.apk"  "dist/Telegram-XRay-${{ env.APP_VERSION_NAME }}-universal.apk"
          mv "$OUT/a64/standalone/app.apk"   "dist/Telegram-XRay-${{ env.APP_VERSION_NAME }}-arm64.apk"
          mv "$OUT/a32/standalone/app.apk"   "dist/Telegram-XRay-${{ env.APP_VERSION_NAME }}-arm32.apk"
          mv "$OUT/x64/standalone/app.apk"   "dist/Telegram-XRay-${{ env.APP_VERSION_NAME }}-x86_64.apk"
          mv "$OUT/x86/standalone/app.apk"   "dist/Telegram-XRay-${{ env.APP_VERSION_NAME }}-x86.apk"
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-XRay-${{ env.APP_VERSION_NAME }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Telegram XRay ${{ env.APP_VERSION_NAME }}
          files: dist/*.apk
          body: |
            Telegram ${{ env.APP_VERSION_NAME }} with built-in XRay (VLESS) proxy support.
            XRay core v26.3.27 bundled for all architectures.

            - **universal**: all ABIs (armeabi-v7a, arm64-v8a, x86, x86_64)
            - **arm64**: arm64-v8a (most modern phones)
            - **arm32**: armeabi-v7a (older phones)
            - **x86_64** / **x86**: emulators and x86 devices

            Signed with a personal key — uninstall the official Telegram first if the package signature conflicts.
