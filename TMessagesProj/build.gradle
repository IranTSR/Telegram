def nativeTarget = project.findProperty("nativeTarget")?.toString() ?: ""
def xrayVersion = "v26.3.27"
// Recent Xray-core releases only ship android binaries for arm64-v8a and x86_64.
// armeabi-v7a and x86 have no official android asset, so they must be supplied
// as prebuilt binaries (built from the same xrayVersion with Go, GOOS=android)
// via XRAY_PREBUILT_DIR/<abi>/libxray.so (see the CI workflow).
def xrayAssetMap = [
    "arm64-v8a": "Xray-android-arm64-v8a.zip",
    "x86_64": "Xray-android-amd64.zip",
]
def xrayPrebuiltDir = System.getenv("XRAY_PREBUILT_DIR") ? new File(System.getenv("XRAY_PREBUILT_DIR")) : null
def xrayOutputDir = file("$buildDir/xray")
def xrayDownloadDir = new File(xrayOutputDir, "download")
def xrayJniDir = new File(xrayOutputDir, "jniLibs")
def xrayAssetsDir = new File(xrayOutputDir, "assets")
def xrayTargets = []
if (nativeTarget != 'SKIP') {
    if (!nativeTarget.isBlank()) {
        xrayTargets = [nativeTarget]
    } else {
        xrayTargets = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
    }
}

def downloadXrayAsset = { File zipFile, String assetName ->
    if (!zipFile.exists() || zipFile.length() == 0) {
        def url = new URL("https://github.com/XTLS/Xray-core/releases/download/${xrayVersion}/${assetName}")
        url.withInputStream { input ->
            zipFile.withOutputStream { output ->
                output << input
            }
        }
    }
}

def extractXrayZip = { File zipFile, byte[] buffer, Closure<File> picker ->
    ZipInputStream zip = new ZipInputStream(new BufferedInputStream(new FileInputStream(zipFile)))
    try {
        ZipEntry entry
        while ((entry = zip.getNextEntry()) != null) {
            if (entry.isDirectory()) {
                continue
            }
            File out = picker.call(entry.getName())
            if (out != null) {
                out.withOutputStream { output ->
                    int read
                    while ((read = zip.read(buffer)) > 0) {
                        output.write(buffer, 0, read)
                    }
                }
            }
        }
    } finally {
        zip.close()
    }
}

def prepareXrayCore = tasks.register("prepareXrayCore") {
    inputs.property("xrayVersion", xrayVersion)
    inputs.property("xrayTargets", xrayTargets.join(","))
    outputs.dir(xrayJniDir)
    outputs.dir(xrayAssetsDir)
    doLast {
        if (xrayTargets.isEmpty()) {
            return
        }
        xrayDownloadDir.mkdirs()
        xrayJniDir.mkdirs()
        def assetsDir = new File(xrayAssetsDir, "xray")
        assetsDir.mkdirs()
        byte[] buffer = new byte[8192]
        // geoip.dat/geosite.dat are arch-independent: always take them from the arm64 asset.
        def geoipOut = new File(assetsDir, "geoip.dat")
        def geositeOut = new File(assetsDir, "geosite.dat")
        if (!geoipOut.exists() || geoipOut.length() == 0 || !geositeOut.exists() || geositeOut.length() == 0) {
            def geoZip = new File(xrayDownloadDir, xrayAssetMap["arm64-v8a"])
            downloadXrayAsset(geoZip, xrayAssetMap["arm64-v8a"])
            extractXrayZip(geoZip, buffer) { name ->
                if ("geoip.dat".equals(name)) return geoipOut
                if ("geosite.dat".equals(name)) return geositeOut
                return null
            }
        }
        for (String abi : xrayTargets) {
            def abiDir = new File(xrayJniDir, abi)
            abiDir.mkdirs()
            def libOut = new File(abiDir, "libxray.so")
            if (libOut.exists() && libOut.length() > 0) {
                continue
            }
            def prebuilt = xrayPrebuiltDir != null ? new File(new File(xrayPrebuiltDir, abi), "libxray.so") : null
            if (prebuilt != null && prebuilt.exists() && prebuilt.length() > 0) {
                java.nio.file.Files.copy(prebuilt.toPath(), libOut.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } else {
                def assetName = xrayAssetMap[abi]
                if (assetName == null) {
                    throw new GradleException("XRay: no official android binary for ABI '${abi}' in ${xrayVersion}; provide it as XRAY_PREBUILT_DIR/${abi}/libxray.so")
                }
                def zipFile = new File(xrayDownloadDir, assetName)
                downloadXrayAsset(zipFile, assetName)
                extractXrayZip(zipFile, buffer) { name ->
                    if ("xray".equals(name) || name.endsWith("/xray")) return libOut
                    return null
                }
            }
            libOut.setExecutable(true, false)
        }
    }
}

def aetherVersion = "v2.1.0"
// Official Aether android assets only exist for arm64-v8a, armeabi-v7a and
// x86_64. x86 has no official asset: it can be supplied as a prebuilt via
// AETHER_PREBUILT_DIR/x86/libaether.so (see the CI workflow). Without it,
// libaether.so is skipped for x86 and the app transparently disables Aether
// on x86 devices.
def aetherAssetMap = [
    "arm64-v8a": "aether-android-arm64.tar.gz",
    "armeabi-v7a": "aether-android-armv7.tar.gz",
    "x86_64": "aether-android-x86_64.tar.gz",
]
def aetherPrebuiltDir = System.getenv("AETHER_PREBUILT_DIR") ? new File(System.getenv("AETHER_PREBUILT_DIR")) : null
def aetherOutputDir = file("$buildDir/aether")
def aetherDownloadDir = new File(aetherOutputDir, "download")
def aetherJniDir = new File(aetherOutputDir, "jniLibs")
def aetherTargets = []
if (nativeTarget != 'SKIP') {
    if (!nativeTarget.isBlank()) {
        aetherTargets = [nativeTarget]
    } else {
        aetherTargets = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
    }
}

def downloadAetherAsset = { File tarFile, String assetName ->
    if (!tarFile.exists() || tarFile.length() == 0) {
        def url = new URL("https://github.com/CluvexStudio/Aether/releases/download/${aetherVersion}/${assetName}")
        url.withInputStream { input ->
            tarFile.withOutputStream { output ->
                output << input
            }
        }
    }
}

def prepareAetherCore = tasks.register("prepareAetherCore") {
    inputs.property("aetherVersion", aetherVersion)
    inputs.property("aetherTargets", aetherTargets.join(","))
    outputs.dir(aetherJniDir)
    doLast {
        if (aetherTargets.isEmpty()) {
            return
        }
        aetherDownloadDir.mkdirs()
        aetherJniDir.mkdirs()
        for (String abi : aetherTargets) {
            def abiDir = new File(aetherJniDir, abi)
            abiDir.mkdirs()
            def libOut = new File(abiDir, "libaether.so")
            if (libOut.exists() && libOut.length() > 0) {
                continue
            }
            def prebuilt = aetherPrebuiltDir != null ? new File(new File(aetherPrebuiltDir, abi), "libaether.so") : null
            if (prebuilt != null && prebuilt.exists() && prebuilt.length() > 0) {
                java.nio.file.Files.copy(prebuilt.toPath(), libOut.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } else {
                def assetName = aetherAssetMap[abi]
                if (assetName == null) {
                    project.logger.lifecycle("Aether: no official android binary for ABI '${abi}' in ${aetherVersion}; skipping libaether.so (Aether will be unavailable on ${abi})")
                    continue
                }
                def tarFile = new File(aetherDownloadDir, assetName)
                downloadAetherAsset(tarFile, assetName)
                def tmpDir = new File(aetherDownloadDir, "extract-" + abi)
                project.delete(tmpDir)
                tmpDir.mkdirs()
                ant.untar(src: tarFile, dest: tmpDir, compression: "gzip")
                def binFile = new File(tmpDir, "aether")
                if (!binFile.exists() || binFile.length() == 0) {
                    throw new GradleException("Aether: 'aether' binary not found inside ${assetName}")
                }
                java.nio.file.Files.copy(binFile.toPath(), libOut.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                project.delete(tmpDir)
            }
            libOut.setExecutable(true, false)
        }
    }
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    ndkVersion "27.2.12479018"

    sourceSets.main.jniLibs.srcDirs = ['./jni/', xrayJniDir, aetherJniDir]
    sourceSets.main.assets.srcDirs += [xrayAssetsDir]

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }


    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            shrinkResources false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "0"
        }

        HA_private {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
